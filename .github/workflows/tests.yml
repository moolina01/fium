# Corre las pruebas automáticas y el typecheck en cada push y pull request a main.
# Nota: Railway despliega igual aunque esto falle; revisa la pestaña Actions en GitHub.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
